       </div>

<!-- 1. HEADER — bold sans + serif italic accent (red underline draws on) -->

<!-- 2. SEAM CAPTION — one clip per spoken word (generate from words.json) -->

<!-- 3. HERO FRAME — any object goes inside .stage (centre of the panel) -->

  <!-- object markup -->
</div></div>

<!-- 4. CHAPTER DEVICE (recurring) — glowing ring with orbiting light dots.
        Swap the SVG for your own device (loop, key, eye…) — keep it ONE recognisable shape. -->
<div class="abs" data-layout-allow-overflow id="ring" style="position:absolute;left:240px;top:380px;width:600px;height:600px;opacity:0">
  <svg width="600" height="600" viewBox="0 0 600 600" style="overflow:visible">
    <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7a86"/><stop offset=".5" stop-color="#ff1f36"/><stop offset="1" stop-color="#7a0010"/></linearGradient></defs>
    <g class="glow-r">
      <circle cx="300" cy="300" r="210" fill="none" stroke="url(#rg)" stroke-width="58"/>
      <circle cx="300" cy="300" r="232" fill="none" stroke="rgba(255,220,225,.55)" stroke-width="3"/>
    </g>
    <g id="ringDots"><circle cx="510" cy="300" r="9" fill="#39ff8f"/><circle cx="90" cy="300" r="9" fill="#ffc53d"/><circle cx="300" cy="90" r="9" fill="#fff"/></g>
  </svg>
</div>
<div class="sm-chap" data-layout-allow-overflow id="ch1"><div class="num">1<small>the shout-out</small></div></div>
<!-- SMKit.chapter(tl,'#ring','#ch1',t,1.3);
     tl.to('#ringDots',{rotate:360*6,svgOrigin:'300 300',duration:VT,ease:'none'},0); -->

<div class="coinlist" style="display:flex;flex-direction:column;gap:34px">

  <div class="sm-coin-row" id="c2"><div class="sm-coin">2</div><div class="t">attention</div></div>
  <div class="sm-coin-row" id="c3"><div class="sm-coin">3</div><div class="t">followers</div></div>
</div>

</svg>
